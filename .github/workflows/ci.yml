name: CI

# MLX only runs on Apple Silicon, so the tests (which import mlx.core)
# must execute on a macOS runner. macos-latest is arm64, which is what
# `pip install mlx` publishes wheels for.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest -v
